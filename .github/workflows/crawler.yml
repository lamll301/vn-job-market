name: Run Job Crawler

on:
  schedule:
    - cron: '0 1 * * *' # Chạy tự động lúc 01:00 UTC (8:00 sáng giờ VN)
  workflow_dispatch: # Nút bấm chạy thủ công trên GitHub UI

jobs:
  crawl:
    runs-on: ubuntu-latest

    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'
        cache-dependency-path: 'requirements-crawler.txt'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-crawler.txt

    - name: Run Crawler
      env:
        MONGODB_URI: ${{ secrets.MONGODB_URI }}
        MONGODB_DATABASE: ${{ secrets.MONGODB_DATABASE }}
        PYTHONPATH: src
      run: |
        python src/crawler_runner.py